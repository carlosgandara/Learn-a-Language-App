
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Despacio.ai — Learn Any Language with AI</title>

  <meta
    name="description"
    content="Learn any language at your own pace with Despacio.ai."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 28px 6%;
      border-bottom: 1px solid #eeeeee;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
      color: #111111;
    }

    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.12;
    }

    .subtitle {
      color: #666666;
      font-size: 18px;
      line-height: 1.6;
      margin: 0 0 50px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .languages {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .language-card {
      border: 1px solid #dddddd;
      border-radius: 12px;
      padding: 34px 18px;
      text-decoration: none;
      color: #111111;
      background: #ffffff;
      transition:
        border-color 0.2s,
        background 0.2s,
        transform 0.2s;
    }

    .language-card:hover {
      border-color: #111111;
      background: #fafafa;
      transform: translateY(-3px);
    }

    .language-card:focus-visible {
      outline: 3px solid #555555;
      outline-offset: 3px;
    }

    .language-icon {
      font-size: 35px;
      margin-bottom: 18px;
    }

    .language-name {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .language-description {
      color: #777777;
      font-size: 14px;
    }

    .footer {
      padding: 25px;
      text-align: center;
      color: #999999;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .languages {
        grid-template-columns: 1fr;
      }

      .language-card {
        padding: 25px;
      }

      .subtitle {
        margin-bottom: 35px;
      }
    }
  </style>
<script src="{{ url_for('static', filename='ui-diagnostics.js') }}" data-report-url="{{ url_for('browser_error') }}"></script>
</head>

<body>

  <header class="header">
    <a href="/" class="logo">despacio.ai</a>
  </header>

  <main class="main">
    <div class="container">

      <h1>Learn Any Language with AI.</h1>

      <p class="subtitle">
        Learn at your own pace.<br>
        Practice words, sentences, and real conversations.
      </p>

      <div class="section-title">
        Choose your language
      </div>

      <div class="languages">

        <a
          href="{{ url_for('select_language', language='tl') }}"
          class="language-card"
        >
          <div class="language-icon">🇵🇭</div>
          <div class="language-name">Tagalog</div>
          <div class="language-description">
            Start or continue learning
          </div>
        </a>

        <a
          href="{{ url_for('select_language', language='es') }}"
          class="language-card"
        >
          <div class="language-icon">🇪🇸</div>
          <div class="language-name">Spanish</div>
          <div class="language-description">
            Start or continue learning
          </div>
        </a>

      </div>

    </div>
  </main>

  <footer class="footer">
    © Despacio.ai — Learn at your own pace.
  </footer>

</body>
</html>
